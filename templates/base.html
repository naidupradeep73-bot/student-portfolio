<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}STUDENT{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body>{% with notices=get_flashed_messages(with_categories=true) %}{% if notices %}<div class="notices">{% for category,message in notices %}<div class="notice {{category}}">{{message}}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block body %}{% endblock %}<script src="{{ url_for('static',filename='js/app.js') }}"></script></body></html>
