{% extends 'base.html' %}{% block title %}Profile — Portfolia{% endblock %}{% block body %}<div class="app-shell">{% include 'sidebar.html' %}<main class="dash"><header class="topbar"><div><p class="eyebrow">ACCOUNT</p><h1>Profile settings</h1></div></header><form class="settings-form" method="post" enctype="multipart/form-data"><label>Full name<input name="full_name" value="{{user.full_name}}" required></label><label>Email address<input value="{{user.email}}" disabled></label><label>Phone<input name="phone" value="{{user.phone}}"></label><label>Location<input name="location" value="{{user.location|default('')}}"></label><label>Profile photo<input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp"></label><label class="wide">Short bio<textarea name="short_bio">{{user.short_bio|default('')}}</textarea></label><button class="button">Save settings →</button></form></main></div>{% endblock %}
